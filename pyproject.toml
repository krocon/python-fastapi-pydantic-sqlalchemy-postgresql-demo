[project]
name = "users-items-api"
version = "0.1.0"
description = "FastAPI · Pydantic v2 · SQLAlchemy 2 (async) · PostgreSQL – step by step"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi[standard]>=0.143.0",
    "protobuf>=6.31",
    "sqlalchemy[asyncio]>=2.0",
    "strawberry-graphql>=0.280",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "grpcio-tools>=1.74",
]
